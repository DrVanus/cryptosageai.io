<!--
  REWRITTEN 2026-09-07 as plain static HTML, with no /_next/ references.

  This page was the Next.js export's 404. Its VISIBLE content was always the inline
  markup below — the chunks it loaded were React hydration for a page that hydrates
  nothing. Those chunks were the only thing on the whole site still pulling in the
  retired Next.js build, and that build was reachable at a public URL carrying a
  complete SECOND pricing table (different prices and CTAs from the live one) plus
  three capability claims the audit had already retired from both the app and
  index.html: an ad-related paid benefit on a tier where no ad SDK exists at any tier,
  a social/marketplace feature whose data is local-only sample content, and a
  prediction-accuracy-by-tier claim contradicted by the fact that model selection
  follows the requested timeframe rather than the subscription tier. The exact
  sentences are deliberately not reproduced here — this comment is served to every
  visitor, and quoting a retired claim republishes it. They are recorded in
  x-ads/cryptosage/AUDIT.json forbidden_claims and in site-audit-contract.json.

  Unreferenced is not unserved. index.html referenced these chunks zero times, so every
  one of those claims was invisible to a reader of the rendered site and fully readable
  to anyone who fetched the file. Deleting the runtime is what actually retires them.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; text-align:center;
         font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#111; background:#fff; }
  @media (prefers-color-scheme: dark) { body { color:#f5f5f5; background:#0b0b0d; } }
  /* Side by side with a divider when there is room; stacked and divider-free when
     there is not. The Next.js original hard-coded line-height:49px on BOTH headings,
     which is why a narrow viewport broke the sentence across two 49px-tall lines. */
  .row { display:flex; align-items:center; gap:20px; padding:0 20px; max-width:520px; }
  h1 { margin:0; padding-right:20px; border-right:1px solid rgba(128,128,128,.4);
       font-size:24px; font-weight:500; line-height:1.4; }
  h2 { margin:0; font-size:14px; font-weight:400; line-height:1.4; }
  @media (max-width: 420px) {
    .row { flex-direction:column; gap:8px; }
    h1 { padding-right:0; border-right:0; }
  }
  a.back { margin-top:28px; color:#e8bf6a; text-decoration:none; font-weight:500; }
  a.back:hover { text-decoration:underline; }
</style>
